<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#101114" />
  <title>Navazon — Synced Lyrics Demo</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    *{box-sizing:border-box}
    :root{
      --bg:#0b0c0f;
      --card:rgba(255,255,255,.06);
      --muted:rgba(255,255,255,.38);
      --soft:rgba(255,255,255,.62);
      --text:#fff;
      --accent:#fff;
    }
    html,body{margin:0;min-height:100%;background:
      radial-gradient(900px 520px at 50% -10%,rgba(126,92,255,.22),transparent 60%),
      radial-gradient(760px 520px at 110% 40%,rgba(0,179,255,.13),transparent 55%),
      var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Vazirmatn","Segoe UI",sans-serif}
    body{min-height:100dvh;overflow:hidden}
    .app{height:100dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 18px)}
    .top{display:flex;align-items:center;justify-content:space-between;direction:ltr;margin-bottom:14px}
    .brand{font-weight:700;letter-spacing:.2px;font-size:14px;opacity:.84}
    .badge{font-size:11px;padding:7px 10px;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.05);border-radius:999px;color:var(--soft)}
    .track{display:flex;align-items:center;gap:13px;direction:ltr;margin-bottom:14px}
    .cover{
      width:58px;height:58px;border-radius:15px;flex:0 0 auto;
      display:grid;place-items:center;
      background:
        linear-gradient(145deg,rgba(255,255,255,.18),rgba(255,255,255,.03)),
        radial-gradient(circle at 20% 20%,#8f6cff 0 8%,transparent 35%),
        linear-gradient(135deg,#272a34,#101116 70%);
      border:1px solid rgba(255,255,255,.08);
      box-shadow:0 12px 30px rgba(0,0,0,.28);
      font-weight:800;font-size:11px;letter-spacing:.6px
    }
    .meta{min-width:0}
    .title{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .artist{font-size:13px;color:var(--muted);margin-top:3px}
    .lyrics-wrap{position:relative;flex:1;min-height:0;border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.015));border:1px solid rgba(255,255,255,.055);overflow:hidden}
    .fade-top,.fade-bottom{position:absolute;z-index:3;left:0;right:0;height:82px;pointer-events:none}
    .fade-top{top:0;background:linear-gradient(180deg,rgba(13,14,18,.98),rgba(13,14,18,0))}
    .fade-bottom{bottom:0;background:linear-gradient(0deg,rgba(13,14,18,.98),rgba(13,14,18,0))}
    .lyrics{height:100%;overflow:auto;scrollbar-width:none;padding:42% 22px 45%;scroll-behavior:smooth}
    .lyrics::-webkit-scrollbar{display:none}
    .line{
      direction:rtl;text-align:right;font-size:24px;line-height:1.55;font-weight:760;
      color:rgba(255,255,255,.2);margin:0 0 28px;transition:.32s ease;
      transform-origin:right center;cursor:pointer;letter-spacing:-.35px
    }
    .line.near{color:rgba(255,255,255,.38)}
    .line.active{color:#fff;transform:scale(1.055);text-shadow:0 2px 18px rgba(255,255,255,.08)}
    .line small{display:block;font-size:11px;font-weight:500;color:rgba(255,255,255,.22);margin-top:3px;direction:ltr;text-align:right}
    .player{padding-top:14px;direction:ltr}
    .progress-hit{padding:10px 0 7px;cursor:pointer}
    .progress{height:4px;background:rgba(255,255,255,.14);border-radius:999px;overflow:hidden}
    .bar{height:100%;width:0;background:#fff;border-radius:999px}
    .times{display:flex;justify-content:space-between;font-size:10px;color:rgba(255,255,255,.32);margin-top:5px}
    .controls{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-top:5px}
    .hint{font-size:11px;color:rgba(255,255,255,.32);direction:rtl}
    .play{
      width:56px;height:56px;border:0;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;
      font-size:20px;font-weight:900;cursor:pointer;box-shadow:0 8px 28px rgba(0,0,0,.25);transition:.15s
    }
    .play:active{transform:scale(.95)}
    .live{justify-self:end;display:flex;align-items:center;gap:6px;font-size:11px;color:rgba(255,255,255,.38)}
    .dot{width:6px;height:6px;border-radius:50%;background:#fff;opacity:.75;box-shadow:0 0 10px rgba(255,255,255,.45)}
    .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 88px);background:rgba(255,255,255,.1);backdrop-filter:blur(14px);padding:8px 12px;border-radius:12px;font-size:11px;color:rgba(255,255,255,.75);opacity:0;pointer-events:none;transition:.25s}
    .toast.show{opacity:1}
    @media (max-height:690px){.line{font-size:21px;margin-bottom:22px}.lyrics{padding-top:34%;padding-bottom:38%}.cover{width:50px;height:50px}.track{margin-bottom:10px}}
  </style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">NAVAZON</div>
    <div class="badge">Synced Lyrics · Demo</div>
  </div>

  <div class="track">
    <div class="cover">NAVAZON</div>
    <div class="meta">
      <div class="title">دموی متن همگام</div>
      <div class="artist">Navazon Preview</div>
    </div>
  </div>

  <section class="lyrics-wrap">
    <div class="fade-top"></div>
    <div class="fade-bottom"></div>
    <div class="lyrics" id="lyrics"></div>
  </section>

  <div class="player">
    <div class="progress-hit" id="seek">
      <div class="progress"><div class="bar" id="bar"></div></div>
      <div class="times"><span id="cur">0:00</span><span id="dur">0:36</span></div>
    </div>
    <div class="controls">
      <div class="hint">روی هر خط بزن تا به همان بخش بروی</div>
      <button class="play" id="play" aria-label="play">▶</button>
      <div class="live"><span class="dot"></span> KARAOKE</div>
    </div>
  </div>
</div>
<div class="toast" id="toast">این دمو فعلاً صدا ندارد؛ فقط تجربهٔ Synced Lyrics را نشان می‌دهد.</div>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    try { tg.setHeaderColor('#0b0c0f'); tg.setBackgroundColor('#0b0c0f'); } catch(e){}
  }

  const data = [
    [0.0,'گاهی یک آهنگ از دور می‌رسه'],
    [4.4,'آروم می‌شینه کنارِ خاطره‌هات'],
    [9.0,'یک خط روشن می‌شه، درست همین لحظه'],
    [13.8,'و باقیِ کلمه‌ها کمی دورتر می‌مونن'],
    [19.0,'هرچی آهنگ جلو می‌ره، متن هم همراهشه'],
    [24.0,'بی‌اینکه لازم باشه از تلگرام بیرون بری'],
    [29.0,'این می‌تونه تجربهٔ Lyrics در Navazon باشه'],
    [34.0,'ساده، سریع، و همگام با موسیقی']
  ];
  const DURATION = 38;

  const lyrics = document.getElementById('lyrics');
  const play = document.getElementById('play');
  const bar = document.getElementById('bar');
  const cur = document.getElementById('cur');
  const seek = document.getElementById('seek');
  const toast = document.getElementById('toast');

  data.forEach(([t,text],i)=>{
    const el=document.createElement('div');
    el.className='line';
    el.dataset.time=t;
    el.innerHTML='<span>'+text+'</span><small>'+format(t)+'</small>';
    el.addEventListener('click',()=>{ elapsed=t; start=performance.now()-elapsed*1000; update(true); });
    lyrics.appendChild(el);
  });

  const lines=[...document.querySelectorAll('.line')];
  let running=false, elapsed=0, start=performance.now(), lastIdx=-1, raf;

  function format(v){
    v=Math.max(0,Math.floor(v));
    return Math.floor(v/60)+':'+String(v%60).padStart(2,'0');
  }

  function indexFor(t){
    let idx=0;
    for(let i=0;i<data.length;i++){ if(t>=data[i][0]) idx=i; else break; }
    return idx;
  }

  function activate(idx, force=false){
    if(idx===lastIdx && !force) return;
    lastIdx=idx;
    lines.forEach((el,i)=>{
      el.classList.toggle('active',i===idx);
      el.classList.toggle('near',Math.abs(i-idx)===1);
    });
    lines[idx]?.scrollIntoView({behavior:force?'auto':'smooth',block:'center'});
    try { tg?.HapticFeedback?.selectionChanged(); } catch(e){}
  }

  function update(force=false){
    if(running) elapsed=(performance.now()-start)/1000;
    if(elapsed>=DURATION){ elapsed=DURATION; running=false; play.textContent='▶'; }
    bar.style.width=(elapsed/DURATION*100)+'%';
    cur.textContent=format(elapsed);
    activate(indexFor(elapsed),force);
    if(running) raf=requestAnimationFrame(update);
  }

  play.addEventListener('click',()=>{
    running=!running;
    if(running){
      if(elapsed>=DURATION) elapsed=0;
      start=performance.now()-elapsed*1000;
      play.textContent='❚❚';
      toast.classList.add('show');
      setTimeout(()=>toast.classList.remove('show'),2200);
      cancelAnimationFrame(raf);
      raf=requestAnimationFrame(update);
    } else {
      elapsed=(performance.now()-start)/1000;
      play.textContent='▶';
      cancelAnimationFrame(raf);
      update();
    }
  });

  seek.addEventListener('click',e=>{
    const r=seek.getBoundingClientRect();
    const x=Math.max(0,Math.min(r.width,e.clientX-r.left));
    elapsed=(x/r.width)*DURATION;
    if(running) start=performance.now()-elapsed*1000;
    update(true);
  });

  document.getElementById('dur').textContent=format(DURATION);
  update(true);
</script>
</body>
</html>
