name: Radio Javan Archive Harvest

on:
  push:
    branches: [archive-builder-cloud]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: archive-builder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm test
      - run: npm run check

  pilot:
    needs: tests
    if: contains(github.event.head_commit.message, '[archive-pilot]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: archive-builder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Run fixed 50-song pilot
        env:
          RJ_REQUEST_DELAY_MS: '1200'
          RJ_MAX_ATTEMPTS: '4'
          RJ_TIMEOUT_MS: '20000'
          RJ_SYSTEMIC_FAILURE_THRESHOLD: '3'
        run: node src/pilot.js --urls-file ./data/pilot-urls.txt --limit 50 --out ./out/pilot
      - name: Upload pilot diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rj-pilot
          path: archive-builder/out/pilot
          retention-days: 14
          if-no-files-found: error

  snapshot:
    needs: tests
    if: contains(github.event.head_commit.message, '[archive-run]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: archive-builder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node src/prepare-snapshot.js
      - uses: actions/upload-artifact@v4
        with:
          name: rj-snapshot
          path: archive-builder/runtime
          retention-days: 14
          if-no-files-found: error

  plan:
    needs: [tests, snapshot]
    if: contains(github.event.head_commit.message, '[archive-run]')
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.make.outputs.shards }}
    steps:
      - id: make
        shell: bash
        run: echo 'shards='"$(node -e 'console.log(JSON.stringify(Array.from({length:128},(_,i)=>i)))')" >> "$GITHUB_OUTPUT"

  harvest:
    needs: [tests, snapshot, plan]
    if: contains(github.event.head_commit.message, '[archive-run]')
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: archive-builder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/download-artifact@v4
        with:
          name: rj-snapshot
          path: archive-builder/runtime
      - name: Harvest shard
        env:
          RJ_REQUEST_DELAY_MS: '1200'
          RJ_MAX_ATTEMPTS: '4'
          RJ_TIMEOUT_MS: '20000'
          RJ_SYSTEMIC_FAILURE_THRESHOLD: '5'
        run: node src/run-shard.js --shard-index "${{ matrix.shard }}" --shard-count 128
      - name: Upload shard result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rj-shard-${{ matrix.shard }}
          path: archive-builder/out/shard-*
          retention-days: 14
          if-no-files-found: error

  merge:
    needs: [snapshot, harvest]
    if: always() && contains(github.event.head_commit.message, '[archive-run]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: archive-builder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/download-artifact@v4
        with:
          name: rj-snapshot
          path: archive-builder/runtime
      - uses: actions/download-artifact@v4
        with:
          pattern: rj-shard-*
          path: archive-builder/artifacts
      - run: node src/merge.js --in ./artifacts --out ./out/final --manifest ./runtime/snapshot-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: rj-final
          path: archive-builder/out/final
          retention-days: 30
          if-no-files-found: error
