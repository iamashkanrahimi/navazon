name: Spotify Public Web Probe
on:
  push:
    branches: [experiment/spotify-artist-pilot]
permissions: {contents: read}
jobs:
  probe:
    if: contains(github.event.head_commit.message, '[spotify-probe]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect MyStreamCount letter endpoint
        run: |
          python - <<'PY'
          import urllib.request,json,re,html
          for letter in ['H','S','O']:
            u='https://www.mystreamcount.com/artists/letter/'+letter
            req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'})
            with urllib.request.urlopen(req,timeout=30) as r:
              d=json.load(r)
            print('LETTER',letter,'keys',d.keys(),'count',d.get('count'),'htmlbytes',len(d.get('html','')))
            h=d.get('html','')
            links=re.findall(r'href=["\']([^"\']*/artist/[^"\']+)["\']',h,re.I)
            texts=re.findall(r'href=["\']([^"\']*/artist/([^"\']+))["\'][^>]*>[\s\S]{0,700}?<h[1-6][^>]*>([\s\S]*?)</h',h,re.I)
            print('links',links[:20])
            print('sample',h[:5000])
          PY
