name: Spotify Public Web Probe

on:
  push:
    branches:
      - experiment/spotify-artist-pilot

permissions:
  contents: read

jobs:
  probe:
    if: contains(github.event.head_commit.message, '[spotify-probe]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe Wikidata Spotify IDs
        run: |
          python - <<'PY'
          import urllib.request,urllib.parse,json,time
          names=['Hamed Pahlan','Omid Ameri','Behzad Pax','Majid Akhshabi','Shayan Eshraghi']
          ua='NavazonArchivePilot/0.1'
          def get(url):
            req=urllib.request.Request(url,headers={'User-Agent':ua,'Accept':'application/json'})
            with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          for name in names:
            params=urllib.parse.urlencode({'action':'wbsearchentities','search':name,'language':'en','format':'json','limit':5})
            data=get('https://www.wikidata.org/w/api.php?'+params)
            print('\nNAME',name)
            for item in data.get('search',[])[:5]:
              qid=item['id']
              ent=get('https://www.wikidata.org/wiki/Special:EntityData/'+qid+'.json')['entities'][qid]
              vals=ent.get('claims',{}).get('P1902',[])
              ids=[]
              for c in vals:
                try: ids.append(c['mainsnak']['datavalue']['value'])
                except: pass
              print(qid,item.get('label'),item.get('description'),'spotify',ids)
              time.sleep(.15)
          PY
