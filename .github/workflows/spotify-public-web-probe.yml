name: Spotify Public Web Probe

on:
  push:
    branches:
      - experiment/spotify-artist-pilot

permissions:
  contents: read

jobs:
  probe:
    if: contains(github.event.head_commit.message, '[spotify-probe]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe Spotify oEmbed
        run: |
          python - <<'PY'
          import urllib.request,urllib.parse,json
          artist='https://open.spotify.com/artist/4WPjbuFjnb2CaknMPZgr1Y'
          url='https://open.spotify.com/oembed?url='+urllib.parse.quote(artist,safe='')
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=30) as r:
            data=json.load(r)
            print(json.dumps(data,ensure_ascii=False,indent=2))
          PY
