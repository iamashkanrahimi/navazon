name: Spotify Public Web Probe

on:
  push:
    branches:
      - experiment/spotify-artist-pilot

permissions:
  contents: read

jobs:
  probe:
    if: contains(github.event.head_commit.message, '[spotify-probe]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Spotify credentials availability
        env:
          CID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          CSEC: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: |
          python - <<'PY'
          import os
          print("client_id_configured", bool(os.getenv("CID")))
          print("client_secret_configured", bool(os.getenv("CSEC")))
          PY
