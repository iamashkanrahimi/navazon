name: Spotify Public Web Probe

on:
  push:
    branches:
      - experiment/spotify-artist-pilot

permissions:
  contents: read

jobs:
  probe:
    if: contains(github.event.head_commit.message, '[spotify-probe]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe anonymous token against Spotify search API
        run: |
          python - <<'PY'
          import urllib.request,re,json,urllib.parse
          ua='Mozilla/5.0'
          def req(url,headers=None):
            h={'User-Agent':ua}
            if headers:h.update(headers)
            with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=30) as r:
              return r.read().decode('utf-8','replace')
          html=req('https://open.spotify.com/embed/artist/4WPjbuFjnb2CaknMPZgr1Y')
          m=re.search(r'<script id="__NEXT_DATA__" type="application/json">([\s\S]*?)</script>',html)
          obj=json.loads(m.group(1))
          token=obj['props']['pageProps']['state']['settings']['session']['accessToken']
          url='https://api.spotify.com/v1/search?type=artist&limit=5&q='+urllib.parse.quote('Hamed Pahlan')
          data=json.loads(req(url,{'Authorization':'Bearer '+token}))
          print('artists',[(x['name'],x['id'],len(x.get('images') or [])) for x in data.get('artists',{}).get('items',[])])
          PY
