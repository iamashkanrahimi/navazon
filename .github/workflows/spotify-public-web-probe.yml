name: Spotify Public Web Probe
on:
  push:
    branches: [experiment/spotify-artist-pilot]
permissions: {contents: read}
jobs:
  probe:
    if: contains(github.event.head_commit.message, '[spotify-probe]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect MyStreamCount browse implementation
        run: |
          python - <<'PY'
          import urllib.request,re,html
          u='https://www.mystreamcount.com/artists'
          req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=30) as r:d=r.read().decode('utf-8','replace')
          for pat in [r'<script[^>]+src="([^"]+)"',r'<link[^>]+href="([^"]+)"']:
            vals=re.findall(pat,d,re.I)
            print('ASSETS',vals[-30:])
          for needle in ['wire:', 'livewire', 'axios', 'fetch(', 'letter', 'artists', 'x-data', 'Alpine']:
            print('\nNEEDLE',needle,'count',d.lower().count(needle.lower()))
            start=0
            for _ in range(5):
              i=d.lower().find(needle.lower(),start)
              if i<0: break
              print(d[max(0,i-500):i+1000])
              start=i+len(needle)
          PY
