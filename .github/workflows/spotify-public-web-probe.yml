name: Spotify Public Web Probe

on:
  push:
    branches:
      - experiment/spotify-artist-pilot

permissions:
  contents: read

jobs:
  probe:
    if: contains(github.event.head_commit.message, '[spotify-probe]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe Spotify embed artist page
        run: |
          python - <<'PY'
          import urllib.request,re
          url='https://open.spotify.com/embed/artist/4WPjbuFjnb2CaknMPZgr1Y'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=30) as r:
            data=r.read().decode('utf-8','replace')
            print('status',r.status,'bytes',len(data))
            for needle in ['Hamed Pahlan','Aroosi','Amene','Dokhtare Mashreghi','Leyla','Dynamite','__NEXT_DATA__','spotify:track']:
              print(needle,data.find(needle),data.count(needle))
            for pat in [r'<meta[^>]+property="og:image"[^>]+content="([^"]+)"',r'"name":"([^"]+)"']:
              m=re.search(pat,data,re.I)
              print('PAT', m.group(1) if m else None)
          PY
