name: Spotify Public Web Probe

on:
  push:
    branches:
      - experiment/spotify-artist-pilot

permissions:
  contents: read

jobs:
  probe:
    if: contains(github.event.head_commit.message, '[spotify-probe]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe Spotify embed search
        run: |
          python - <<'PY'
          import urllib.request
          for url in ['https://open.spotify.com/embed/search/Ali%20Yasini','https://open.spotify.com/embed/search/Hamed%20Pahlan']:
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
            try:
              with urllib.request.urlopen(req,timeout=30) as r:
                data=r.read().decode('utf-8','replace')
                print('URL',url,'status',r.status,'bytes',len(data))
                for needle in ['Ali Yasini','Hamed Pahlan','spotify:artist','spotify:track','__NEXT_DATA__']:
                  print(needle,data.find(needle),data.count(needle))
            except Exception as e:
              print('ERR',url,repr(e))
          PY
