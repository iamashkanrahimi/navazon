name: Spotify Public Web Probe

on:
  push:
    branches:
      - experiment/spotify-artist-pilot

permissions:
  contents: read

jobs:
  probe:
    if: contains(github.event.head_commit.message, '[spotify-probe]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe search engine discovery
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.parse, urllib.request, re, html
          q='site:open.spotify.com/artist "Ali Yasini"'
          url='https://html.duckduckgo.com/html/?q='+urllib.parse.quote(q)
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=30) as r:
            data=r.read().decode('utf-8','replace')
            print('status',r.status,'bytes',len(data))
            print(data[:3000])
            links=re.findall(r'class="result__a"[^>]+href="([^"]+)"',data)
            print('links',links[:10])
          PY
