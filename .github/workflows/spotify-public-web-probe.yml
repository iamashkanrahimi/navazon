name: Spotify Public Web Probe
on:
  push:
    branches: [experiment/spotify-artist-pilot]
permissions: {contents: read}
jobs:
  probe:
    if: contains(github.event.head_commit.message, '[spotify-probe]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe MyStreamCount artist browse routes
        run: |
          python - <<'PY'
          import urllib.request
          urls=[
            'https://www.mystreamcount.com/artists?letter=H',
            'https://www.mystreamcount.com/artists?startsWith=H',
            'https://www.mystreamcount.com/artists/H',
            'https://www.mystreamcount.com/artists/h',
          ]
          for u in urls:
            try:
              req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=30) as r:
                d=r.read().decode('utf-8','replace')
              print('URL',u,'status',r.status,'bytes',len(d),'Hamed Pahlan',d.find('Hamed Pahlan'),'artistlinks',d.count('/artist/'))
              print(d[d.find('Hamed Pahlan')-300:d.find('Hamed Pahlan')+500] if 'Hamed Pahlan' in d else d[:500])
            except Exception as e: print('ERR',u,repr(e))
          PY
