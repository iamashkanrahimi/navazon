name: Spotify Public Web Probe

on:
  push:
    branches:
      - experiment/spotify-artist-pilot

permissions:
  contents: read

jobs:
  probe:
    if: contains(github.event.head_commit.message, '[spotify-probe]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe MusicBrainz Spotify relations
        run: |
          python - <<'PY'
          import urllib.request,urllib.parse,json,time
          names=['Hamed Pahlan','Omid Ameri','Behzad Pax','Majid Akhshabi','Shayan Eshraghi']
          ua='NavazonArchivePilot/0.1 (contact: iamashkanrahimi@gmail.com)'
          def get(url):
            req=urllib.request.Request(url,headers={'User-Agent':ua,'Accept':'application/json'})
            with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          for name in names:
            q=urllib.parse.quote(f'artist:"{name}"')
            data=get('https://musicbrainz.org/ws/2/artist/?query='+q+'&fmt=json&limit=5')
            print('\nNAME',name,'found',len(data.get('artists',[])))
            for a in data.get('artists',[])[:3]:
              print(' cand',a.get('name'),a.get('id'),a.get('score'))
              time.sleep(1.1)
              d=get('https://musicbrainz.org/ws/2/artist/'+a['id']+'?inc=url-rels&fmt=json')
              sp=[r.get('url',{}).get('resource') for r in d.get('relations',[]) if 'spotify.com/artist/' in (r.get('url',{}).get('resource') or '')]
              print('  spotify',sp)
          PY
