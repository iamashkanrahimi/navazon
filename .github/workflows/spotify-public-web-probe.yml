name: Spotify Public Web Probe

on:
  push:
    branches:
      - experiment/spotify-artist-pilot

permissions:
  contents: read

jobs:
  probe:
    if: contains(github.event.head_commit.message, '[spotify-probe]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Spotify embed JSON shape
        run: |
          python - <<'PY'
          import urllib.request,re,json
          url='https://open.spotify.com/embed/artist/4WPjbuFjnb2CaknMPZgr1Y'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=30) as r:
            data=r.read().decode('utf-8','replace')
          m=re.search(r'<script id="__NEXT_DATA__" type="application/json">([\s\S]*?)</script>',data)
          print('next_data_found',bool(m))
          if m:
            obj=json.loads(m.group(1))
            print('top keys',list(obj.keys()))
            print(json.dumps(obj,ensure_ascii=False)[:16000])
          PY
