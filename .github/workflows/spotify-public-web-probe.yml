name: Spotify Public Web Probe

on:
  push:
    branches:
      - experiment/spotify-artist-pilot

permissions:
  contents: read

jobs:
  probe:
    if: contains(github.event.head_commit.message, '[spotify-probe]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe Spotify track embed JSON
        run: |
          python - <<'PY'
          import urllib.request,re,json
          tid='6UdMio7NkVcP2np3KO1WDL'
          url='https://open.spotify.com/embed/track/'+tid
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=30) as r:
            data=r.read().decode('utf-8','replace')
          m=re.search(r'<script id="__NEXT_DATA__" type="application/json">([\s\S]*?)</script>',data)
          print('next',bool(m))
          if m:
            obj=json.loads(m.group(1))
            entity=obj['props']['pageProps']['state']['data']['entity']
            print(json.dumps(entity,ensure_ascii=False,indent=2)[:12000])
          PY
