name: Spotify Public Web Probe
on:
  push:
    branches: [experiment/spotify-artist-pilot]
permissions: {contents: read}
jobs:
  probe:
    if: contains(github.event.head_commit.message, '[spotify-probe]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect MyStreamCount artist page track markup
        run: |
          python - <<'PY'
          import urllib.request,re
          for aid in ['4WPjbuFjnb2CaknMPZgr1Y','0yyGyaFI5hg8VJMJwV5CwK','62AW9VlTxtw554o2Sll0fK']:
            u='https://www.mystreamcount.com/artist/'+aid
            req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
            with urllib.request.urlopen(req,timeout=30) as r:d=r.read().decode('utf-8','replace')
            print('ID',aid,'bytes',len(d),'tracklinks',d.count('/track/'))
            for needle in ['/track/','Dokhtare Mashreghi','Ghoroor','Hamine']:
              i=d.find(needle)
              print('needle',needle,'idx',i)
              if i>=0: print(d[max(0,i-700):i+1500])
          PY
