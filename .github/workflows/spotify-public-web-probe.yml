name: Spotify Public Web Probe

on:
  push:
    branches:
      - experiment/spotify-artist-pilot

permissions:
  contents: read

jobs:
  probe:
    if: contains(github.event.head_commit.message, '[spotify-probe]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe MyStreamCount sitemap
        run: |
          python - <<'PY'
          import urllib.request,re
          u='https://www.mystreamcount.com/sitemap.xml'
          req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=30) as r:
            data=r.read().decode('utf-8','replace')
            print('status',r.status,'bytes',len(data))
            print(data[:5000])
            urls=re.findall(r'<loc>([^<]+)</loc>',data)
            print('URLCOUNT',len(urls))
            print('ARTISTS',sum('/artist/' in x for x in urls),'TRACKS',sum('/track/' in x for x in urls))
            print('FIRST',urls[:30])
          PY
