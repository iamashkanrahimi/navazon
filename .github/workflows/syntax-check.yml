name: syntax-check

on:
  push:
    branches:
      - main
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: find src -name '*.js' -print0 | xargs -0 -n1 node --check

      - run: npm test
